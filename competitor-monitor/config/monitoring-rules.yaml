monitoring:
  pilot_duration_days: 14

  schedules:
    CLIENTS_CASES:
      frequency: daily
      severity_threshold: HIGH
    NEWS_LAUNCHES:
      frequency: daily
      severity_threshold: HIGH
    OFFERS:
      frequency: weekly
      severity_threshold: MEDIUM

  url_filter:
    relevant_terms:
      - soluções
      - solucoes
      - produtos
      - serviços
      - servicos
      - offerings
      - services
      - solutions
      - portfolio
      - portfólio
      - capabilities
      - cybersecurity
      - segurança
      - seguranca
      - cloud
      - infrastructure
      - infraestrutura
      - data center
      - datacenter
      - compliance
      - privacidade
      - privacy
      - governance
      - governança
      - grc
      - clients
      - clientes
      - customers
      - customer stories
      - cases
      - case studies
      - success stories
      - parceiros
      - partners
      - alliances
      - alianças
      - technology partners
      - press
      - noticias
      - notícias
      - lançamento
      - lancamento
      - novo produto
      - nova solução

    ignore_terms:
      - carreira
      - careers
      - jobs
      - vagas
      - investor
      - investidor
      - cookies
      - termos-de-uso
      - privacy-policy
      - politica-de-privacidade
      - contato
      - contact
      - sobre-nos
      - about
      - biografia
      - executivos
      - leadership
      - team

    max_pages_per_competitor: 30
    max_content_chars_per_page: 15000

  severity:
    HIGH:
      - new_client
      - new_case
      - new_product
      - new_solution
      - new_offer
      - proprietary_launch
      - new_partnership_creates_capability
    MEDIUM:
      - functional_change
      - scope_expansion
      - new_delivery_mode
      - new_integration
      - overlap_classification_change
      - offer_removed
      - case_removed
    LOW:
      - messaging_change
      - naming_change
      - benefit_repositioning
      - wording_change
    IGNORE:
      - seo_change
      - cta_change
      - layout_change
      - design_change
      - cookie_change
      - footer_change
      - menu_change
      - typo_fix
      - image_change
      - html_technical

  alerts:
    email:
      enabled: false
      recipient: ""
      smtp_host: ""
      smtp_port: 587
      subject_template: "[Monitoramento de Concorrentes] {count} alterações encontradas — {date}"
      send_only_on: [HIGH, MEDIUM]
      consolidate: true

  deduplication:
    fingerprint_fields:
      - competitor_id
      - monitored_field
      - change_type
      - normalized_value
    algorithm: sha256

  llm:
    model: claude-haiku-4-5-20251001
    fallback_model: claude-sonnet-4-6
    max_tokens_per_call: 1024
    temperature: 0
    only_on_hash_change: true
    send_only_diff: true
    max_diff_chars: 3000
    max_context_chars: 500
    max_taxonomy_items_per_call: 10
